name: Deploy pdf-viewer

on:
  push:
    branches: [main]
    paths:
      - 'apps/pdf-viewer/**'
      - '.github/workflows/deploy-pdf-viewer.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pdf-viewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/pdf-viewer
          command: pages deploy dist --project-name=pdf-viewer --branch=main
